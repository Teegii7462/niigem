const tbody = document.getElementById('tbody');
const search = document.getElementById('search');
const chFilter = document.getElementById('chFilter');
const fieldFilter = document.getElementById('fieldFilter');
const countLabel = document.getElementById('countLabel');

function render() {

function toChatLang(str) {
  if (!str) return '';
  let s = str.toLowerCase();
  
  const cyrMap = {
    'ё': 'yo', 'ж': 'j', 'ц': 'ts', 'ч': 'ch', 'ш': 'sh', 'щ': 'shch', 'ю': 'yu', 'я': 'ya',
    'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'е': 'e', 'з': 'z', 'и': 'i', 'й': 'i', 
    'к': 'k', 'л': 'l', 'м': 'm', 'н': 'n', 'о': 'o', 'ө': 'o', 'п': 'p', 'р': 'r', 'с': 's', 
    'т': 't', 'у': 'u', 'ү': 'u', 'ф': 'f', 'х': 'h', 'ъ': '', 'ы': 'y', 'ь': 'i', 'э': 'e'
  };

  let res = '';
  for (let i = 0; i < s.length; i++) {
    let c = s[i];
    if (cyrMap[c] !== undefined) {
      res += cyrMap[c];
    } else if (c === 'x') {
      res += 'h';
    } else if (c === 'v') {
      res += 'u';
    } else if (c === 'c') {
      res += 'ts'; 
    } else {
      res += c;
    }
  }
  return res;
}

function toSkeleton(str) {
  let lat = toChatLang(str);
  let consonants = '';
  
  
  for (let i = 0; i < lat.length; i++) {
    let c = lat[i];
    if (!['a', 'e', 'i', 'o', 'u', 'y', ' ', '-', '_', '.', ','].includes(c)) {
      consonants += c;
    }
  }
  
  let finalSkel = '';
  for (let i = 0; i < consonants.length; i++) {
    if ((consonants[i] === 'n' || consonants[i] === 'm') && i < consonants.length - 1) {
      continue;
    }
    finalSkel += consonants[i];
  }
  return finalSkel;
}
const search = document.getElementById('search');
const chFilter = document.getElementById('chFilter');
const fieldFilter = document.getElementById('fieldFilter');
const countLabel = document.getElementById('countLabel');

function render() {
  const q = search.value.trim().toLowerCase();
  
  const qChat = toChatLang(q);
  const qSkel = toSkeleton(q);

  const ch = chFilter.value;
  const fd = fieldFilter.value;
  let count = 0;
  tbody.innerHTML = '';
  
  data.forEach((d, i) => {
   
    const rowText = [d.mn, d.orig, d.theory, d.idea, d.works, d.field].join(' ').toLowerCase();
    
    
    const matchDirect = rowText.includes(q); 
    const matchChat   = toChatLang(rowText).includes(qChat); 
    const matchSkel   = qSkel && toSkeleton(rowText).includes(qSkel); 
    
    const matchQ = !q || matchDirect || matchChat || matchSkel;
    const matchCh = !ch || d.ch.includes(ch);
    const matchFd = !fd || d.field.includes(fd);
    
    if (!matchQ || !matchCh || !matchFd) return;
    count++;
    
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${count}</td>
      <td><strong>${d.mn}</strong></td>
      <td><span class="orig">${d.orig}</span><br><small>${d.years}</small></td>
      <td>${d.nation}</td>
      <td><span class="tag">${d.field}</span></td>
      <td><strong>${d.theory}</strong></td>
      <td class="quote">${d.idea}</td>
      <td><em>${d.works||'—'}</em></td>
      <td>${d.ch.split(',').map(c => `<span class="tag green">Бүлэг ${c.trim()}</span>`).join(' ')}</td>
    `;
    tbody.appendChild(tr);
  });
  
  countLabel.innerText = `Нийт олдсон: ${count}`;
}

search.addEventListener('input', render);
chFilter.addEventListener('change', render);
fieldFilter.addEventListener('change', render);

render();
}
